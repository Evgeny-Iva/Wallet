[project]
name = "wallet"
version = "0.1.0"
description = ""
authors = [
    {name = "Евгений Иванов",email = "ivanov2012gen@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (==0.136.1)",
    "uvicorn (==0.46.0)",
    "sqlalchemy (==2.0.49)",
    "asyncpg (==0.31.0)",
    "pydantic (==2.13.4)",
    "python-dotenv (==1.2.2)",
    "alembic (==1.18.4)",
    "psycopg2 (==2.9.12)",
    "passlib (==1.7.4)",
    "pytest (==9.0.3)",
    "pytest-asyncio (==1.3.0)",
    "python-jose (==3.5.0)",
    "httpx (==0.28.1)",
    "ruff (==0.15.12)",
    "bcrypt (==4.1.2)",
    "redis (==8.0.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.12,<0.16.0)"
]

[tool.poetry]
name = "wallet"
version = "0.1.0"
packages = [{ include = "api" }]
